name: Weekly Brief

on:
  schedule:
    # 13:00 UTC ~= 8-9am ET depending on DST -- close enough for a morning
    # brief that a human reads later; not worth a second cron entry to chase
    # the DST shift exactly. Sunday (before lineup lock) and Tuesday (after
    # waiver processing) per PRD 3.4/6.3.
    - cron: "0 13 * * 0,2"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  # Fallback delivery only -- see the "Deliver" steps below. The @-mention is
  # what makes GitHub send a notification email: repo-watch notifications can
  # be off or filtered, but "Participating and @mentions" is on by default.
  BRIEF_RECIPIENT: j-money-b
  BRIEF_THREAD_TITLE: "Weekly briefs"

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Both renderings come from one gather + one waiver plan (brief_model.py),
      # so the emailed brief and the archived thread can never disagree about
      # what this week's recommendation is.
      - name: Generate brief
        run: |
          set -euo pipefail
          python -m ffai.cli brief --out brief.md --subject-out subject.txt
          python -m ffai.cli brief --format html --out brief.html

      - name: Commit brief
        run: |
          git config user.name "ffai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add brief.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update weekly brief"
          git push

      # Primary delivery: a real HTML email, so the styled brief lands in the
      # inbox rather than being something to go and look for. Skipped cleanly
      # when SMTP secrets aren't configured yet, and never fails the run --
      # the fallback below covers both cases.
      - name: Deliver brief by email
        id: email
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
          BRIEF_FROM: ${{ secrets.BRIEF_FROM }}
        run: |
          if [ -z "${SMTP_HOST:-}" ]; then
            echo "SMTP not configured -- falling back to the GitHub issue thread."
            exit 1
          fi
          python scripts/send_brief_email.py brief.html subject.txt brief.md

      # Fallback delivery: posting to one long-lived issue makes GitHub send a
      # notification email with no SMTP credentials involved. Runs only when
      # the email didn't go out, so a working setup doesn't double-notify --
      # but a broken one still reaches the user rather than going silent (R1).
      - name: Deliver brief as a GitHub notification
        if: steps.email.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          issue=$(gh issue list --state open --search "$BRIEF_THREAD_TITLE in:title" \
                    --limit 1 --json number --jq '.[0].number // empty')

          if [ -z "$issue" ]; then
            url=$(gh issue create \
                    --title "$BRIEF_THREAD_TITLE" \
                    --body "Each run of the Weekly Brief workflow posts here. Keep this issue open -- closing it starts a new thread on the next run.")
            issue="${url##*/}"
            echo "Created brief thread #$issue"
          fi

          {
            echo "@$BRIEF_RECIPIENT"
            echo
            cat brief.md
          } > comment.md

          gh issue comment "$issue" --body-file comment.md
          echo "Posted brief to issue #$issue"

      - name: Report delivery
        run: |
          if [ "${{ steps.email.outcome }}" = "success" ]; then
            echo "Delivered by email."
          else
            echo "Email not sent -- delivered to the GitHub issue thread instead."
          fi
